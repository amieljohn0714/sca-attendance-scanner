<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GA Attendance Scanner</title>

<base href="./">
<link rel="stylesheet" href="./style.css">

<script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<div class="container">

<h1>
GA Attendance Scanner
</h1>

<div class="controls">

<label for="apiUrlInput">Attendance endpoint</label>

<div class="controls-row">

<input id="apiUrlInput" type="url" placeholder="https://script.google.com/macros/s/AKfycbyO5afPbnMP54PlrjHF73v5PWf2Qo-mVmxr9h33FP7s_Flml6DBva8xShp1i395aMB9Vg/exec">

<button id="saveApiUrlBtn" type="button">Save</button>

</div>

<p class="hint">For mobile phones, open the Google Apps Script web app directly. Use the deployed Apps Script URL ending in /exec, not the Google Sheets document link.</p>

<button id="startScannerBtn" type="button" class="start-button">Start Scanner</button>

</div>

<div id="reader"></div>

<div id="result">
Initializing camera...
</div>

</div>

<script src="./app.js"></script>

</body>

</html>
