<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#212155"
    >

    <title>
        SCA-CCP Attendance Scanner
    </title>

    <base href="./">

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <script
        src="https://unpkg.com/html5-qrcode"
    ></script>

</head>


<body>

    <main class="scanner-page">

        <section class="scanner-card">


            <header class="scanner-header">

                <div class="logo-mark">
                    SCA
                </div>


                <div class="organization">

                    <div class="university">
                        University of the East Manila
                    </div>

                    <div class="organization-name">
                        Student Catholic Action
                        <span>
                            Christian Communities Program
                        </span>
                    </div>

                </div>

            </header>


            <div class="header-divider"></div>


            <section class="scanner-heading">

                <div class="eyebrow">
                    CAMPUS MINISTRY
                </div>

                <h1>
                    Attendance Scanner
                </h1>

                <p>
                    Scan a member QR code to record
                    attendance.
                </p>

            </section>


            <section class="scanner-controls">

                <button
                    id="startScannerBtn"
                    type="button"
                    class="start-button"
                >

                    <span class="button-icon">
                        QR
                    </span>

                    Start Scanner

                </button>

            </section>


            <section
                id="reader"
                class="reader"
            ></section>


            <section
                id="result"
                class="result"
            >

                <div class="result-ready">

                    <div class="ready-icon">
                        ✓
                    </div>

                    <div class="ready-title">
                        Ready to Start
                    </div>

                    <div class="ready-text">
                        Tap Start Scanner to activate
                        the camera.
                    </div>

                </div>

            </section>


            <footer class="scanner-footer">

                <div>
                    SCA-CCP Attendance System
                </div>

                <div>
                    University of the East Manila
                </div>

            </footer>


        </section>

    </main>


    <script
        src="./app.js?v=OPT03"
    ></script>

</body>

</html>
