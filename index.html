<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        GA Attendance Scanner
    </title>

    <base href="./">

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <script
        src="https://unpkg.com/html5-qrcode"
    ></script>

</head>


<body>

    <div class="container">

        <h1>
            GA Attendance Scanner
        </h1>


        <!--
            Scanner build identifier.

            This lets us verify that Safari is
            actually loading the latest GitHub build.
        -->

        <div
            id="scannerBuild"
            style="
                font-size: 12px;
                opacity: 0.7;
                margin-top: -10px;
                margin-bottom: 12px;
                text-align: center;
            "
        >
            Build: loading...
        </div>


        <div class="controls">

            <!--
                API endpoint configuration has been
                intentionally removed from the UI.

                The endpoint is now internal to app.js.
            -->


            <button
                id="startScannerBtn"
                type="button"
                class="start-button"
            >
                Start Scanner
            </button>

        </div>


        <div id="reader"></div>


        <div id="result">
            Initializing scanner...
        </div>

    </div>


    <!--
        OPT-01

        Cache-busting version identifier.

        If Safari has an older cached app.js,
        ?v=OPT01 forces the browser to request
        the OPT-01 resource.
    -->

    <script src="./app.js?v=OPT01"></script>

</body>

</html>
